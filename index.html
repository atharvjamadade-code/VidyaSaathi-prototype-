    <script>
      /* Ensure window.fetch is writable and configurable in iframe/sandboxed environments */
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch ? origFetch.bind(window) : undefined;
          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (_) {}
        } catch (e) {
          // Fallback ignored
        }
      })();
    </script>
